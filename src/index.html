<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Your closet</title>

        <link rel="stylesheet" href="styles/main.css" />
        <script src="scripts/main.js" defer></script>
    </head>

    <body>
        <section class="base">
            <div class="clothes">
                <div class="card card__heads prevent-select" data-heads>
                    <div class="card__media"><img src="/assets/images/clothes/heads/14.png" alt="heads" /></div>
                </div>

                <div class="card card__shirts prevent-select" data-shirts>
                    <div class="card__content">
                        <div class="menu">
                            <svg class="icon icon--xl">
                                <use href="#icon-delete"></use>
                            </svg>
                            <svg class="icon icon--xl">
                                <use href="#icon-chevron-left"></use>
                            </svg>
                        </div>
                        <div class="menu">
                            <svg class="icon icon--xl">
                                <use href="#icon-select"></use>
                            </svg>
                            <svg class="icon icon--xl">
                                <use href="#icon-chevron-right"></use>
                            </svg>
                        </div>
                    </div>
                    <div class="card__media"><img src="/assets/images/clothes/shirts/4.png" alt="shirts" /></div>
                </div>

                <div class="card card__pants prevent-select" data-pants>
                    <div class="card__content">
                        <div class="menu">
                            <svg class="icon icon--xl">
                                <use href="#icon-delete"></use>
                            </svg>
                            <svg class="icon icon--xl">
                                <use href="#icon-chevron-left"></use>
                            </svg>
                        </div>
                        <div class="menu">
                            <svg class="icon icon--xl">
                                <use href="#icon-select"></use>
                            </svg>
                            <svg class="icon icon--xl">
                                <use href="#icon-chevron-right"></use>
                            </svg>
                        </div>
                    </div>
                    <div class="card__media"><img src="/assets/images/clothes/pants/1.png" alt="pants" /></div>
                </div>

                <div class="card card__shoes prevent-select" data-shoes>
                    <div class="card__content">
                        <div class="menu">
                            <svg class="icon icon--xl">
                                <use href="#icon-delete"></use>
                            </svg>
                            <svg class="icon icon--xl">
                                <use href="#icon-chevron-left"></use>
                            </svg>
                        </div>
                        <div class="menu">
                            <svg class="icon icon--xl">
                                <use href="#icon-select"></use>
                            </svg>
                            <svg class="icon icon--xl">
                                <use href="#icon-chevron-right"></use>
                            </svg>
                        </div>
                    </div>
                    <div class="card__media"><img src="/assets/images/clothes/shoes/0.png" alt="shoes" /></div>
                </div>
            </div>
        </section>
    </body>
</html>
